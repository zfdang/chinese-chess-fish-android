name: Build-ChessFish

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
  # The base-repository event also allows releases after merging fork PRs.
  pull_request_target:
    branches: [master]
    types: [closed]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    # Closing an unmerged PR does not need another build.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      # Every merged PR must finish its release build; superseded checks can be cancelled.
      cancel-in-progress: ${{ github.event_name != 'pull_request_target' }}
    outputs:
      revision: ${{ steps.revision.outputs.number }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build the actual merged commit, including squash/rebase merges.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Assemble Release APK
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Create ZIP armv8
        working-directory: ./app/build/outputs/apk/armv8-/release/
        run: zip -r ./chessfish-armv8.zip ./*.apk

      - name: Create ZIP armv8-dotprod
        working-directory: ./app/build/outputs/apk/armv8-dotprod-/release/
        run: zip -r ./chessfish-armv8-dotprod.zip ./*.apk

      - name: Get git revision
        id: revision
        run: |
          echo "number=$(git rev-list HEAD --count)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve merged build for release
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/armv8-/release/chessfish-armv8.zip
            app/build/outputs/apk/armv8-dotprod-/release/chessfish-armv8-dotprod.zip
            app/build/outputs/bundle/armv8-Release/*.aab
            app/build/outputs/bundle/armv8-dotprod-Release/*.aab

  release:
    # PR updates, unmerged closures and direct pushes never publish releases.
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.event.pull_request.merge_commit_sha }}
      cancel-in-progress: false
    steps:
      - name: Download merged APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-assets

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.build.outputs.revision }}
          RELEASE_SHA: ${{ needs.build.outputs.commit }}
        run: |
          if ! gh release view "tag-${REVISION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "tag-${REVISION}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Release ${REVISION}" \
              --generate-notes
          fi
          gh release upload "tag-${REVISION}" \
            release-assets/apk/armv8-/release/chessfish-armv8.zip \
            release-assets/apk/armv8-dotprod-/release/chessfish-armv8-dotprod.zip \
            release-assets/bundle/armv8-Release/*.aab \
            release-assets/bundle/armv8-dotprod-Release/*.aab \
            --repo "$GITHUB_REPOSITORY" --clobber
