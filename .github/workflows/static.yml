# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - 'docs/**'
      - '.github/workflows/static.yml'
      - 'scripts/update_local_downloads.py'
      - 'updateApk.sh'

  # Release creation uses GITHUB_TOKEN, so a release event alone would not trigger deployment.
  # Wait for the merged-PR build and its release job to finish before mirroring new installers.
  workflow_run:
    workflows: ["Build-ChessFish"]
    types: [completed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request_target'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run must never check out the triggering PR head or execute its artifacts.
          ref: master
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download and verify latest release installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash updateApk.sh
      - name: Check published site size
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          size = sum(path.stat().st_size for path in Path("docs").rglob("*") if path.is_file())
          if size > 1_000_000_000:
              raise SystemExit(f"Pages site exceeds 1 GB: {size} bytes")
          print(f"Website including installers: {size:,} bytes")
          PYTHON
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Include downloaded ZIPs in the deployment artifact without tracking them in Git.
          path: './docs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
